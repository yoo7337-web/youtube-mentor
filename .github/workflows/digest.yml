name: Giants Digest Daily

on:
  schedule:
    - cron: "0 23 * * *"   # 08:00 KST
  workflow_dispatch: {}     # GitHub UI에서 수동 실행 버튼

permissions:
  contents: write            # digest_state.json 변경분 커밋용

concurrency:
  group: giants-digest-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Send digest (Telegram)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GIANTS_CHANNEL_ID: ${{ secrets.GIANTS_CHANNEL_ID }}
        run: python src/daily_digest.py

      - name: Persist digest state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/digest_state.json
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "chore: update digest state [skip ci]"
            git push
          fi
